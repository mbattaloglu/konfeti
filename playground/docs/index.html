<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>konfeti — docs</title>
    <meta
      name="description"
      content="konfeti documentation: canvas confetti with emoji, text, image and spritesheet particles, composable physics and a typed plugin API."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://konfeti.mbattaloglu.com/docs/" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display&display=swap"
    />
    <link rel="stylesheet" href="/src/docs/docs.css" />
  </head>
  <body class="docs-page">
    <header class="app-header">
      <div class="app-brand">
        <h1>konfeti</h1>
        <span class="app-tag" data-i18n="docs.tag">docs</span>
        <span id="version" class="app-version"></span>
      </div>
      <nav class="app-nav" aria-label="Site" data-i18n-aria-label="nav.site">
        <a href="%BASE_URL%" data-i18n="nav.playground">Playground</a>
        <a href="%BASE_URL%docs/" aria-current="page" data-i18n="nav.docs">Docs</a>
        <a href="%BASE_URL%docs/api/" data-i18n="nav.api">API</a>
        <a class="app-nav-extra" href="https://github.com/mbattaloglu/konfeti">GitHub</a>
      </nav>
      <div id="lang-switch" class="lang-switch"></div>
    </header>

    <div class="docs-layout">
      <aside class="docs-sidebar">
        <p class="docs-sidebar-title" data-i18n="docs.guide">Guide</p>
        <nav
          id="docs-toc"
          class="docs-toc"
          aria-label="Guide sections"
          data-i18n-aria-label="docs.guideSections"
        ></nav>
        <p class="docs-sidebar-title" data-i18n="docs.reference">Reference</p>
        <nav class="docs-toc" aria-label="Reference" data-i18n-aria-label="docs.reference">
          <a href="%BASE_URL%docs/api/" data-i18n="docs.apiReference">API reference ↗</a>
          <a href="%BASE_URL%" data-i18n="docs.playgroundLink">Playground ↗</a>
        </nav>
      </aside>

      <main id="docs-content" class="docs-content"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/docs/main.ts"></script>
  </body>
</html>
