name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # pinned: the e2e step relies on the runner's preinstalled Chrome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      # browser tests against the built dist and site, in the runner's preinstalled Chrome
      - run: pnpm site:build
      - run: pnpm --filter konfeti-e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
